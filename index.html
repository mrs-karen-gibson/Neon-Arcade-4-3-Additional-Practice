<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Arcade</title><style>
:root{color-scheme:dark;--bg:#080e22;--panel:#111b38;--cyan:#36e5ff;--pink:#fa65e7;--purple:#a88aff;--text:#f5f8ff;--muted:#b9c9e9}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:radial-gradient(ellipse at 15% 0%,#24306c 0%,transparent 40%),radial-gradient(ellipse at 90% 35%,#381c59 0%,transparent 35%),var(--bg);color:var(--text);margin:0;min-height:100vh}header{padding:36px 20px 28px;text-align:center;border-bottom:2px solid #36e5ff66;background:linear-gradient(110deg,#101c40dd,#1d1444dd);box-shadow:0 8px 28px #0005}header h1{margin:0;font-size:clamp(1.8rem,5vw,3rem);font-weight:900;letter-spacing:.055em;text-transform:uppercase;text-shadow:0 0 15px #36e5ff88}header .eyebrow{color:var(--cyan);font-size:.8rem;font-weight:900;letter-spacing:.3em;margin-bottom:10px}header .subtitle{color:var(--muted);margin-top:10px;font-weight:600}main{max-width:880px;margin:auto;padding:20px}.panel{background:linear-gradient(135deg,#142043,#111831);border:1px solid #586db67d;padding:clamp(16px,3vw,25px);border-radius:18px;margin:18px 0;box-shadow:0 12px 35px #0005, inset 0 1px #ffffff16}.panel h2{color:var(--cyan);font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase;margin-top:0}.panel p{line-height:1.55}input,select,button{font:inherit;padding:12px;border:1px solid #6983bd;border-radius:10px;max-width:100%;box-sizing:border-box}input,select{background:#080f29;color:white;outline-offset:3px}input:focus,select:focus{outline:2px solid var(--cyan);border-color:var(--cyan)}input[type=number]{width:108px}input[type=text]{width:100%}input[type=radio]{accent-color:var(--cyan)}button{background:linear-gradient(110deg,#05bdd9,#5b75ff);color:#07132a;border:0;cursor:pointer;margin:5px;font-weight:900;box-shadow:0 4px 16px #18b9f044;min-height:46px}button:hover{filter:brightness(1.14)}button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}button.secondary{background:#26395d;color:#f1f6ff;border:1px solid #6586c0;box-shadow:none}button:disabled{opacity:.4;cursor:not-allowed;filter:none}#submit{background:linear-gradient(110deg,#f276e5,#a68bff);color:#17112e;box-shadow:0 4px 16px #f276e544}table{border-collapse:collapse;margin:12px 0;background:#0b1530;max-width:100%}td,th{border:1px solid #51689b;padding:9px;text-align:center}th{color:var(--cyan);background:#18264a}svg.graph{background:white;border:2px solid var(--cyan);border-radius:10px;touch-action:manipulation;max-width:100%;box-shadow:0 0 18px #36e5ff30}.hint{color:var(--muted);font-size:.9rem}.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.row>label{flex:1 1 170px}.hidden{display:none}.status{font-weight:700}#notice{padding:10px;color:#f4dcff;min-height:28px}label{display:block;margin:8px 0;font-weight:600}label input,label select{margin-top:7px}progress{width:100%;height:20px;accent-color:var(--cyan);margin-top:14px}#count{display:block;margin-top:8px;color:var(--cyan);font-weight:800;letter-spacing:.06em}#question{border-color:#36e5ff88}#question>p:first-of-type{font-size:1.13rem;font-weight:650}#question label:has(input[type=radio]){padding:10px;border:1px solid #5368a0;border-radius:12px;margin:12px 0;background:#0c1732}#question label:has(input[type=radio]:checked){border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}@media(max-width:520px){main{padding:12px}.panel{margin:12px 0}.row>label{flex:1 1 100%}button{margin:5px 2px}table{font-size:.9rem}td,th{padding:6px}}

.checkbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.feedback{font-weight:800;padding:12px;border-radius:10px;margin-top:10px}
.feedback.good{background:#0c4935;color:#a6ffcf;border:1px solid #36e49a}
.feedback.bad{background:#512033;color:#ffbdca;border:1px solid #ff718a}
.correct-field{border:3px solid #3de39a!important;background:#103d31!important}
.wrong-field{border:3px solid #ff667d!important;background:#4b1b31!important}
.mark{font-size:1.25rem;font-weight:900;margin-left:8px}
.mark.good{color:#5cffac}.mark.bad{color:#ff8195}
.level-nav{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
.level-nav button{min-height:35px;margin:2px;padding:7px 11px;font-size:.85rem}
.level-nav button.passed{background:#135b42;color:#b8ffda}
.level-nav button.retry{background:#67273b;color:#ffd5dc}
.level-nav button.current{outline:2px solid #fff}
</style></head><body><header><div class="eyebrow">★ MATH ARCADE ★</div><h1>NEON ARCADE: LEVEL UP!</h1><div class="subtitle">4-3 Additional Practice • 15 Challenges • Explore Functions</div></header><main><section class="panel"><div class="row"><label>First name<input id="first" type="text" autocomplete="given-name"></label><label>Last name<input id="last" type="text" autocomplete="family-name"></label><label>Class Period<select id="period" required><option value="">Select class period</option><option value="3rd">3rd</option><option value="4th">4th</option><option value="5th">5th</option><option value="6th">6th</option></select></label></div><p class="hint">Your progress saves on this device. Complete the challenges and tap Submit to send your answers to your teacher.</p><progress id="progress" max="15" value="0"></progress><span id="count"></span><div id="levelnav" class="level-nav" aria-label="Choose a level"></div></section><section class="panel" id="question"></section><section class="panel"><button id="check">✓ Check Answers</button><button class="secondary" id="prev">← Back</button><button id="next">Next →</button><button id="submit">Submit all answers</button><div id="notice" role="status"></div></section></main><script>
// Teacher: paste your deployed Apps Script web-app URL below.
const SHEET_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzzobkDGCszMTlNxAUlH8P8jM7VXhOK3b7r1XBovHEJSvmRoB4VUl_B1L7uty2IefIr/exec';
const problems=[
{kind:'outputs',heading:'Complete the table for y = −8x + 7.',xs:[-1,0,1,2]},
{kind:'outputs',heading:'Complete the table for y = 1.25x + 2.',xs:[-4,0,4,8]},
{kind:'outputs',heading:'Complete the table for y = −x/3 + 5.',xs:[-6,-3,0,3]},
{kind:'graph',heading:'Graph the function represented by this table.',xs:[-2,-1,0,1],ys:[7,5,3,1]},
{kind:'graph',heading:'Graph the function represented by this table.',xs:[-4,-2,0,2],ys:[-1,-2,-3,-4]},
{kind:'graph',heading:'Graph the function represented by this table.',xs:[-1,0,1,2],ys:[-4,0,4,8]},
{kind:'equation',heading:'Write an equation for this table.',xs:[0,1,2,3],ys:[-1,2,5,8]},
{kind:'equation',heading:'Write an equation for this table.',xs:[0,2,4,6],ys:[4,2,0,-2]},
{kind:'equation',heading:'Write an equation for this table.',xs:[0,4,8,12],ys:[6,7,8,9]},
{kind:'equation',heading:'Write an equation for the graphed line.',line:{m:-1,b:3},points:[[-2,5],[1,2],[2,1]]},
{kind:'equation',heading:'Write an equation for the graphed line.',line:{m:-1.5,b:-2},points:[[-4,4],[-2,1],[0,-2]]},
{kind:'equation',heading:'Write an equation for the graphed line.',line:{m:2,b:-1},points:[[-1,-3],[1,1],[2,3]]},
{kind:'choice',heading:'Which table represents a linear function?',options:[{label:'A',xs:[0,1,4,9,16],ys:[0,1,2,3,4]},{label:'B',xs:[-2,-1,0,1,2],ys:[4,1,0,1,4]},{label:'C',xs:[-2,-1,0,1,2],ys:[-15,-9,-3,3,9]},{label:'D',xs:[-2,-1,0,1,2],ys:[8,1,0,-1,-8]}]},
{kind:'equation',heading:'Mario is 75 miles from home. He drives 30 miles per hour toward home. Write an equation for his distance y from home after x hours.'},
{kind:'equation',heading:'Jayla has 12 tulip bulbs planted. She plants 3 more bulbs each minute. Write an equation for the total bulbs y after x minutes.'}
];
const KEY='lesson43-practice-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state.answers ||= {};state.page ||=0;state.checked ||= {};
for(const k of ['first','last','period']){document.getElementById(k).value=state[k]||'';document.getElementById(k).addEventListener((k==='period'?'change':'input'),e=>{state[k]=e.target.value;save()})}
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateProgress()}
function changed(i){delete state.checked[i];save();}
function completed(i){let a=state.answers[i],p=problems[i];return p.kind==='outputs'?Array.isArray(a)&&a.length===4&&a.every(x=>String(x).trim()!==''):p.kind==='graph'?Array.isArray(a)&&a.length>=2:p.kind==='choice'?!!a:!!String(a||'').trim()}
function updateProgress(){let n=problems.filter((_,i)=>completed(i)).length;document.getElementById('progress').value=n;document.getElementById('count').textContent=` ${Object.values(state.checked).filter(v=>v.passed).length} / 15 LEVELS CLEARED · ${n} ANSWERED`;let nav=document.getElementById('levelnav');nav.innerHTML=problems.map((p,i)=>`<button type="button" class="secondary ${state.checked[i]?.passed?'passed':state.checked[i]?'retry':''} ${state.page===i?'current':''}" data-level="${i}">${state.checked[i]?.passed?'✓ ':''}${i+1}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.page=+b.dataset.level;save();render()})}
function table(xs,ys,editable,i){return `<table><tr><th>Input, x</th><th>Output, y</th></tr>${xs.map((x,j)=>`<tr><td>${x}</td><td>${editable?`<input type="number" step="any" data-out="${j}" aria-label="Output for x ${x}" value="${(state.answers[i]||[])[j]??''}">`:ys[j]}</td></tr>`).join('')}</table>`}
function graph(p,i,editable){let size=330,step=27,origin=165;let pts=editable?(state.answers[i]||[]):p.points||[];let grid='';for(let k=-6;k<=6;k++){let z=origin+k*step;grid+=`<line x1="${z}" y1="3" x2="${z}" y2="327" stroke="#d5dbe0"/><line x1="3" y1="${z}" x2="327" y2="${z}" stroke="#d5dbe0"/>`}let axes=`<line x1="3" y1="165" x2="327" y2="165" stroke="#222" stroke-width="2"/><line x1="165" y1="3" x2="165" y2="327" stroke="#222" stroke-width="2"/><text x="311" y="158">x</text><text x="173" y="16">y</text>`;let line='';if(p.line){let x1=-6,x2=6,y1=p.line.m*x1+p.line.b,y2=p.line.m*x2+p.line.b;line=`<line x1="${origin+x1*step}" y1="${origin-y1*step}" x2="${origin+x2*step}" y2="${origin-y2*step}" stroke="#1c4e80" stroke-width="3"/>`;}else if(pts.length>=2){let a=pts[0],b=pts[1];if(a[0]!==b[0]){let m=(b[1]-a[1])/(b[0]-a[0]),c=a[1]-m*a[0];line=`<line x1="3" y1="${origin-(m*(-6)+c)*step}" x2="327" y2="${origin-(m*6+c)*step}" stroke="#176a58" stroke-width="2.5"/>`}}let dots=pts.map(([x,y],j)=>`<circle cx="${origin+x*step}" cy="${origin-y*step}" r="6" fill="${editable?'#176a58':'#1c4e80'}"/>`).join('');return `<svg class="graph" viewBox="0 0 330 330" width="330" height="330" id="plot" role="img" aria-label="Coordinate grid from negative 6 to 6 on both axes">${grid}${axes}${line}${dots}</svg>${editable?'<p class="hint">Tap the grid to plot points. Tap a plotted point to remove it. At least two points are required. For points outside the grid, use the coordinate entry boxes below.</p><div class="row"><label>x <input id="px" type="number" step="any"></label><label>y <input id="py" type="number" step="any"></label><button id="addpoint">Add point</button><button class="secondary" id="clearpoints">Clear points</button></div><p id="pointlist"></p>':''}`}

function close(a,b){return Math.abs(Number(a)-Number(b))<0.00001}
function linearFromEquation(input){
  // Accept y=mx+b, y=b+mx, y=x, y=-x, and fractional coefficients.
  let s=String(input||'').toLowerCase().replace(/\s+/g,'').replace(/−/g,'-').replace(/×/g,'*');
  if(!s.startsWith('y='))return null;
  let rhs=s.slice(2).replace(/(\d)(x)/g,'$1*$2');
  if(!/^[0-9x.+*/()-]+$/.test(rhs))return null;
  // Evaluate a safe, strictly limited arithmetic expression without eval.
  function calc(x){
    let tokens=rhs.replace(/x/g,'('+x+')').match(/\d*\.?\d+|[()+*/-]/g);
    if(!tokens||tokens.join('')!==rhs.replace(/x/g,'('+x+')'))return NaN;
    let pos=0;
    function expr(){let v=term();while(tokens[pos]==='+'||tokens[pos]==='-'){let op=tokens[pos++],w=term();v=op==='+'?v+w:v-w}return v}
    function term(){let v=factor();while(tokens[pos]==='*'||tokens[pos]==='/'){let op=tokens[pos++],w=factor();v=op==='*'?v*w:v/w}return v}
    function factor(){if(tokens[pos]==='-'){pos++;return -factor()}if(tokens[pos]==='+'){pos++;return factor()}if(tokens[pos]==='('){pos++;let v=expr();if(tokens[pos++]!==')')throw Error('parenthesis');return v}let v=Number(tokens[pos++]);if(!Number.isFinite(v))throw Error('number');return v}
    try{let v=expr();return pos===tokens.length&&Number.isFinite(v)?v:NaN}catch{return NaN}
  }
  let b=calc(0),m=calc(1)-b;
  if(!Number.isFinite(b)||!Number.isFinite(m)||!close(calc(2),2*m+b))return null;
  return {m,b};
}
function expectedLine(i){
  const lines={6:{m:3,b:-1},7:{m:-1,b:4},8:{m:.25,b:6},9:{m:-1,b:3},10:{m:-1.5,b:-2},11:{m:2,b:-1},13:{m:-30,b:75},14:{m:3,b:12}};
  return lines[i];
}
function grade(i){
  let p=problems[i],a=state.answers[i];
  if(p.kind==='outputs'){let expected=p.xs.map(x=>i===0?-8*x+7:i===1?1.25*x+2:-x/3+5);let cells=expected.map((v,j)=>String((a||[])[j]??'').trim()!==''&&close((a||[])[j],v));return {passed:cells.every(Boolean),cells,message:cells.every(Boolean)?'All outputs correct!':`${cells.filter(Boolean).length} of 4 outputs correct. Fix the red boxes and check again.`}}
  if(p.kind==='choice'){let passed=a==='C';return {passed,message:passed?'Correct! This table has a constant rate of change.':'Not quite. Look for a constant rate of change.'}}
  if(p.kind==='equation'){let line=linearFromEquation(a),expected=expectedLine(i),passed=!!line&&close(line.m,expected.m)&&close(line.b,expected.b);return {passed,message:passed?'Correct equation!':'Check your slope and y-intercept, then try again. Use y = mx + b.'}}
  if(p.kind==='graph'){let pts=Array.isArray(a)?a:[],expectedM=(p.ys[1]-p.ys[0])/(p.xs[1]-p.xs[0]),expectedB=p.ys[0]-expectedM*p.xs[0];let unique=new Set(pts.map(v=>String(v[0])+','+String(v[1])));let passed=pts.length>=2&&unique.size>=2&&pts.every(([x,y])=>close(y,expectedM*x+expectedB));return {passed,message:passed?'Great graph! Your points are on the correct line.':'Plot at least two different points on the line shown by the table. Remove any incorrect points.'}}
  return {passed:false,message:'Try again.'};
}
function showFeedback(i){
  let g=state.checked[i],p=problems[i],target=document.getElementById('feedback');
  if(!g){target.innerHTML='';return}
  target.innerHTML=`<div class="feedback ${g.passed?'good':'bad'}">${g.passed?'✓ LEVEL CLEARED!':'✕ KEEP GOING!'} ${g.message}</div>`;
  if(p.kind==='outputs'){document.querySelectorAll('[data-out]').forEach((el,j)=>{el.classList.add(g.cells[j]?'correct-field':'wrong-field');let mark=document.createElement('span');mark.className='mark '+(g.cells[j]?'good':'bad');mark.textContent=g.cells[j]?'✓':'✕';el.after(mark)})}
  else if(p.kind==='equation'){document.getElementById('equation')?.classList.add(g.passed?'correct-field':'wrong-field')}
  else if(p.kind==='choice'){document.querySelectorAll('[name=choice]').forEach(el=>{if(el.checked)el.closest('label').classList.add(g.passed?'correct-field':'wrong-field')})}
  else if(p.kind==='graph'){document.getElementById('plot')?.classList.add(g.passed?'correct-field':'wrong-field')}
}
document.getElementById('check').onclick=()=>{let i=state.page;state.checked[i]=grade(i);save();render()};

function render(){let i=state.page,p=problems[i],html=`<h2>Level ${i+1} of 15 ${state.checked[i]?.passed?'✓':''}</h2><p>${p.heading}</p>`;if(p.kind==='outputs')html+=table(p.xs,[],true,i);if(p.kind==='graph')html+=table(p.xs,p.ys,false,i)+graph(p,i,true);if(p.kind==='equation'){if(p.xs)html+=table(p.xs,p.ys,false,i);if(p.line)html+=graph(p,i,false);html+=`<label>Your equation (use x and y):<input id="equation" type="text" value="${escapeHTML(state.answers[i]||'')}" placeholder="y = ..."></label>`}if(p.kind==='choice')html+=p.options.map(o=>`<label><input type="radio" name="choice" value="${o.label}" ${state.answers[i]===o.label?'checked':''}> Option ${o.label}${table(o.xs,o.ys,false,i)}</label>`).join('');html+='<div id="feedback" role="status" aria-live="polite"></div>';document.getElementById('question').innerHTML=html;document.querySelectorAll('[data-out]').forEach(el=>el.addEventListener('input',()=>{let a=state.answers[i]||['','','',''];a[+el.dataset.out]=el.value;state.answers[i]=a;changed(i)}));document.getElementById('equation')?.addEventListener('input',e=>{state.answers[i]=e.target.value;changed(i)});document.querySelectorAll('[name=choice]').forEach(el=>el.addEventListener('change',e=>{state.answers[i]=e.target.value;changed(i)}));if(p.kind==='graph'){let plot=document.getElementById('plot');plot.addEventListener('click',e=>{let rect=plot.getBoundingClientRect(),x=Math.round(((e.clientX-rect.left)*330/rect.width-165)/27),y=Math.round((165-(e.clientY-rect.top)*330/rect.height)/27);togglePoint(i,x,y)});document.getElementById('addpoint').onclick=()=>{let x=Number(document.getElementById('px').value),y=Number(document.getElementById('py').value);if(!Number.isFinite(x)||!Number.isFinite(y)||document.getElementById('px').value===''||document.getElementById('py').value==='')return;togglePoint(i,x,y)};document.getElementById('clearpoints').onclick=()=>{state.answers[i]=[];changed(i);render()};document.getElementById('pointlist').textContent='Plotted: '+(state.answers[i]||[]).map(v=>`(${v.join(', ')})`).join(', ')}document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===14;updateProgress();showFeedback(i)}
function escapeHTML(s){return String(s).replace(/[&"<>]/g,c=>({'&':'&amp;','"':'&quot;','<':'&lt;','>':'&gt;'}[c]))}
function togglePoint(i,x,y){let a=state.answers[i]||[],idx=a.findIndex(v=>v[0]===x&&v[1]===y);if(idx>=0)a.splice(idx,1);else a.push([x,y]);state.answers[i]=a;changed(i);render()}
document.getElementById('prev').onclick=()=>{state.page--;save();render()};document.getElementById('next').onclick=()=>{state.page++;save();render()};document.getElementById('submit').onclick=async()=>{let notice=document.getElementById('notice');if(!state.first?.trim()||!state.last?.trim()||!state.period?.trim()){notice.textContent='Enter your first name, last name, and class period.';return}let incomplete=problems.map((_,i)=>!completed(i)?i+1:null).filter(Boolean);if(incomplete.length&&!confirm('Unfinished questions: '+incomplete.join(', ')+'. Submit anyway?'))return;if(!SHEET_WEB_APP_URL){notice.textContent='Teacher setup required: add the Google Apps Script web-app URL in index.html before students submit.';return}let unchecked=problems.map((_,i)=>!state.checked[i]?.passed?i+1:null).filter(Boolean);if(unchecked.length&&!confirm('Levels not yet cleared: '+unchecked.join(', ')+'. Submit anyway?'))return;let payload={first:state.first,last:state.last,period:state.period,answers:state.answers,submittedAt:new Date().toISOString()};notice.textContent='🚀 Launching your answers…';try{await fetch(SHEET_WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});notice.textContent='🎮 LEVEL COMPLETE! Your answers have been launched! Great work, player!';state.lastSubmittedAt=payload.submittedAt;save()}catch(e){notice.textContent='Could not send. Check your connection and try again.'}};render();
</script></body></html>
